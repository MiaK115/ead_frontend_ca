name: codeql
on:
  push:
    branches: [ "main" ]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'   # weekly (Mon 05:00 UTC)

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]
    steps:
      - uses: actions/checkout@v4

      # Optional but helps analysis on TS projects; safe for JS too
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install deps (best-effort)
        run: |
          if [ -f package-lock.json ]; then npm ci || true; fi
          if [ -f pnpm-lock.yaml ]; then npm i -g pnpm && pnpm i --frozen-lockfile || true; fi
          if [ -f yarn.lock ]; then npm i -g yarn && yarn --frozen-lockfile || true; fi

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # For JS/TS CodeQL doesn’t need a build, but we include an autobuild for completeness
      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"